name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tfplugindocs
        run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0

      - name: Go mod tidy check
        run: go mod tidy -diff

      - name: Generated docs check
        run: |
          make docs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            git diff -- docs
            exit 1
          fi

      - name: Format check
        run: make fmtcheck

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Unit tests
        run: go test ./... -count=1 -v
